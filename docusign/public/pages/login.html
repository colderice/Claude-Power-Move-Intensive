<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — DocuSign Internal</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--gray-100); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-wrap { width: 100%; max-width: 400px; padding: 20px; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .brand { font-size: 22px; font-weight: 800; color: var(--dark); }
  .login-logo .sub { font-size: 12px; color: var(--gray-400); margin-top: 4px; }
  .login-card { background: #fff; border-radius: 12px; padding: 36px; box-shadow: var(--shadow-md); border: 1px solid var(--gray-200); }
  .login-card h2 { font-size: 20px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
  .login-card p { color: var(--gray-500); font-size: 13px; margin-bottom: 24px; }
  #error { display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="brand">📄 AgreementDesk</div>
    <div class="sub">Internal Document Signing</div>
  </div>
  <div class="login-card">
    <h2>Sign in</h2>
    <p>Admin access only</p>
    <div id="error" class="alert alert-error"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-full btn-lg" id="submit-btn">Sign in</button>
    </form>
  </div>
</div>
<script>
  // Already logged in?
  if (localStorage.getItem('ds_token')) window.location.href = '/dashboard';

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      localStorage.setItem('ds_token', data.token);
      localStorage.setItem('ds_user', JSON.stringify(data.user));
      window.location.href = '/dashboard';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
